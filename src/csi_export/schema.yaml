# ─────────────────────────────────────────────────────────────────────────────
# csi_schema.yaml — canonical 30-min datalogger schema for export_csi_annual.py
#
# The canonical vocabulary is the newest EasyFlux-DL (CR6, *_EZFlux_2024_v1 /
# BLS_v5 / BRO_002_flux_v2) table naming, which is AmeriFlux-style
# (H, LE, FC_mass, NETRAD, SW_IN, TA_1_1_1, SWC_1_1_1, …).  Older programs are
# mapped INTO it through `aliases`.  Sources of the aliases:
#   * 2026-09-23 header survey of every Flux_CS*/Flux_Notes TOB3 file across
#     all sites (251 site-year headers, 14 CS + 9 Notes variants):
#       2021-2024 EasyFlux  →  2024+ EZFlux   e.g. SoilWater_i → SWC_i_1_1,
#       hydra{i}_temp → TS_CS65X_1_1_i, batt_volt → V_batt, amb_e → e_amb,
#       TA_2_1_1 → TA_1_1_2 (cell-derived pair), TA_3_1_1 → TA_1_1_3 (probe),
#       T_nr / T_nr_Avg → T_nr_in, LW_IN_meas → R_LW_in_meas,
#       poor_energy_closure_flg → poor_enrg_clsur; Notes: UTC_offset →
#       UTC_OFFSET, amb_rho_a → rho_a_amb.
#   * CR3000-era names (RIP_760 pre-2021, rip760_pre2021_reader.FLUX_RENAME):
#       Hc → H, LE_wpl → LE, Fc_wpl → FC_mass, wnd_spd → WS, T_hmp_Avg → TA_1_1_1,
#       Incoming_SW_Avg → SW_IN, Incoming_LW_TC_Avg → LW_IN (the *_TC_ ones are
#       the absolute longwave; Incoming_LW_Avg is the RAW THERMOPILE → R_LW_in_meas).
#   * Barrelli TOA5/Excel names (convert_barrelli_to_ameriflux.py):
#       SHF{i}_Avg → G_plate_i_1_1, TC{i}_{d}cm_Avg → TS{i}_{d}cm, H{i}_SM → SWC_i_1_1.
#
# Per-site overrides go in the site config under `csi_export.rename` (applied
# BEFORE these aliases) and `csi_export.scale` (unit fixes, e.g. RH as a
# fraction → ×100).  Anything not covered here or there is passed through
# under its raw name and listed in <prefix>_csi_unmapped.csv so it can be
# added.
#
# `table` says where the variable normally lives (cs = Flux_CSFormat,
# notes = Flux_Notes, both).  When the same name occurs in both tables the CS
# value wins and the Notes copy is dropped (they are identical logger values).
# ─────────────────────────────────────────────────────────────────────────────
